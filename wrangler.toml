name = "my-project"
main = "./src/ssr.tsx"
# Pinned to the newest date the installed workerd supports, not to today's date:
# a date beyond that ceiling makes the local runtime refuse to start, so
# `vite dev` breaks for everyone. Raise it only together with wrangler
# (ADR-0018).
compatibility_date = "2026-07-15"
compatibility_flags = ["nodejs_compat"]

# No bindings and no secrets: city generation runs entirely in the browser, in a
# Web Worker, so the Worker only serves the SSR shell and the static assets.
# `wrangler types` still emits an empty CloudflareEnv, which `src/ssr.tsx`
# annotates against.
